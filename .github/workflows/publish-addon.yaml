name: Publish Exodus90 Printer add-on

on:
  push:
    branches:
      - ha-addon
    paths:
      - "addon/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-addon.yaml"
  pull_request:
    branches:
      - ha-addon

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish add-on image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          VERSION=$(sed -n 's#^version: *"\(.*\)"#\1#p' addon/config.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=app
            io.hass.arch=aarch64|amd64

      - name: Make GHCR package public
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/${{ github.event.repository.name }}" \
            -f visibility=public || \
            echo "Could not set package visibility automatically; set it manually in GitHub -> Packages."
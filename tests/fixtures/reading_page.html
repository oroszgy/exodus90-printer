<html><body><turbo-frame id="program_day_3320_frame"><div data-reader-target="body" data-content="# Üdvözlünk az Exodus 90-ben

Testvérek, üdvözlünk benneteket a Szent Mihály-böjtre való felkészülés idején!

Egy olyan testvéri közösséghez csatlakoztatok, amely világszerte férfiak tízezreit fogja össze.
A Szent Mihály-böjt az Exodus 90 nagy becsben tartott hagyományává vált: a megújulás időszaka, amely a Nagyböjt után, az év derekán érkezik el.
Az utóbbi években egyre több férfi tekint Szent Mihályra úgy, mint az Isten iránti hűség példaképére, aki szembeszáll a gonosz erőivel, és rendíthetetlenül kitart Isten mellett.

Ez a felkészülési időszak abban kíván segíteni, hogy helyesen kezdjük meg a Szent Mihály-böjtöt.
Az alábbiakban néhány olyan szempontot találtok, amelyek segítenek lelkileg és gyakorlatilag is felkészülni erre a szent időszakra.

## A Szent Mihály-böjt

A Szent Mihály-böjt az imádság és az áldozathozatal időszaka, amelyet Assisi Szent Ferenc honosított meg a 13. században.
Ebben az időszakban felment a La Verna-hegyre, ahol megkapta a szent sebhelyeket.
Valóban annak az embernek a képe ő, akit Krisztus szabaddá tett, és aki kész követni őt, bárhová is vezeti.

Ebben az évben Dániel könyvét járjuk végig a „Maradj állhatatos!” témájának vezetésével.
Dánielt száműzetésbe hurcolták Babilonba, ő azonban a hatalmas nyomás ellenére is hűséges maradt.
Amikor az oroszlánok vermébe vetették, barátait pedig a tüzes kemencébe dobták, sértetlenek maradtak, mert Istent helyezték az első helyre, és nem voltak hajlandók semmilyen megalkuvásra az iránta való hűségükben.
Mi is száműzetésben élünk ebben a világban, és nap mint nap olyan kihívásokkal találkozunk, amelyek próbára teszik hűségünket.
Szent Mihály közbenjárását kérve szembeszállunk ezekkel a támadásokkal, és szilárdan megállunk a hitben.

## Lelki vezető

Szent Ferenc szeretetének és alázatának rendkívüli példája vezet bennünket, és nagy örömünkre idén egy ferences szerzetes lesz lelki vezetőnk a Szent Mihály-böjt során: Columba Jourdan CFR atya.
Ír pap, a Megújulás Ferences Testvéreinek tagja, aki világszerte keresett előadóvá vált. 
Ő vezeti a Called to More által készített *Little by Little* videópodcastot is.
Fr. Columba jelenleg rendje európai hivatásgondozási igazgatójaként szolgál, és az írországi Limerickben él.
Naponta vezet majd bennünket Dániel könyvén keresztül, sok bölcsességet adva arról, hogyan álljunk szilárdan a hitben férfiként.

## Fegyelmek

A Szent Mihály-böjt fegyelmei arra szolgálnak, hogy segítsenek elszakadnunk azoktól a figyelemelterelésektől és kötődésektől, amelyek akadályozzák Istennel való közösségünket, és visszatartanak bennünket kötelességeink teljesítésétől. 

Íme a Szent Mihály-böjt valamennyi fegyelmi vállalásának listája.
Mindegyik leírását megtalálhatod a Ma fül alján lévő Szent Mihály-böjt kártyán is.

1. Olvasd el a napi olvasmányt és elmélkedést!
2. Napi 30 perc csendes ima!
3. Tarts 1 órás virrasztást péntek hajnalban 2 órakor!
4. Aludj egy teljes éjszakát (8 órát)!
5. Reggel ne nyomd meg a szundi gombot az ébresztőórán!
6. Nincs közösségi média / hírek a Szent Mihály-böjt teljes ideje alatt!
7. Böjtölj szerdán és pénteken!
8. Ne egyél húst szerdán és pénteken!
9. Vegyél hideg zuhanyt szerdán és pénteken!
10. Jelentkezz be a kötéltársadnál minden nap!
11. Vegyél részt a heti testvéri találkozón!
12. Ünnepeld az Úr napját vasárnaponként!

## Lelki felkészülés

A gyümölcsöző út szilárd tervvel kezdődik.
Íme néhány dolog, amely segíthet, hogy már az első napon lendületben legyél.

**1. Imádkozz a „miértedről”**

A „miérted” az a személyes ok, amiért elkötelezted magad erre az útra.
Legyen ez egy világos és tartalmas megfogalmazás, amely arra ösztönöz, hogy folytasd az utat, különösen akkor, amikor az előtted álló hetekben nehezebbé válik!
Szánj időt arra, hogy átgondold és imádságban megvizsgáld, hogyan vezetett téged Isten, milyen emberré hív, mi akadályoz abban, hogy közelebb kerülj hozzá, és önmagadon kívül kikért vállalod ezt az utat!
Ezután írd le egy számodra jelentős helyre.

**2. Tekintsd át a fegyelmeket**

Imádkozz a fegyelmi vállalásokról és azok céljáról.
Van-e köztük olyan, amely különösen megszólít, vagy amelytől tartasz?
Oszd meg gondolataidat a testvéri közösséged tagjaival.
Lehet, hogy nem te vagy az egyetlen, aki bizonytalan, és a testvéreid segíthetnek megvilágítani a fegyelmi vállalások célját és értelmét.

**3. Készülj a győzelmekre – és az esetleges vereségekre** 

Néhány aszketikus fegyelmi vállalás könnyű lesz, mások nehezek. 
Ez nemcsak hogy rendben van, hanem így működik a Szent Mihály-böjt.
Önmagunk megtagadása által megtanulunk alázatosnak lenni, mindenben Istenre támaszkodni, és testvéreinktől imádságos számonkérést, támogatást és bátorítást kérni.
Köteleződjünk el teljes szívvel a fegyelmi vállalások mellett – de legyünk készek arra is, hogy küzdjünk a csüggedés ellen, ha elesünk.
Keljünk fel, és kötelezzük el magunkat újra, tudva, hogy Isten továbbra is munkálkodik bennünk.

## Gyakorlati felkészülés

**1. Csatlakozz egy testvéri közösséghez, és hívj meg más férfiakat**

Ezt nem tudjuk egyedül végigcsinálni.
Kihívást jelenthet minden héten elsőbbséget biztosítani a keresztény testvéri közösségnek, különösen azoknak a férfiaknak, akiknek családjuk van, vagy nehéz munkaidőben dolgoznak. 
Ez az idő azonban nélkülözhetetlen.
Az Exodus testvéri közösségei azon kevés helyek közé tartoznak a világon, ahol a férfiak nyíltak és őszinték lehetnek egymással.
Ez pedig megváltoztathatja az életüket.
Kérdezd meg Istentől, hogy az életedben mely férfiaknak válna javára, ha csatlakoznának hozzád, és ne félj meghívni őket!
Ha olyan férfi jut eszedbe, akiről nem gondolnád, hogy csatlakozna, ne mondj nemet helyette, hanem add meg neki a lehetőséget, hogy ő maga döntsön!

**2. Készíts tervet a fegyelmekre** 

Fontos átgondolni, hogyan hatnak majd a Szent Mihály-böjt fegyelmei a jelenlegi rutinjaidra – különösen azokra, amelyek a családodat érintik.
Ahhoz, hogy jól éljük meg őket, tudatosan kell készülnünk: előre számolva az akadályokkal, világosan kommunikálva, és olyan tervet építve, amely egyszerre reális és hűséges.
Imádkozz arról, hogyan érinthetik a fegyelmi vállalások a családod ritmusát, hogyan készülsz a húsmentes napokra, mikor és hol fogsz imádkozni, és így tovább.
Ha házas vagy, ne feledd, hogy ez a te utad, nem a feleségedé.
Beszélj vele, és dolgozzatok együtt azon, hogy megoldásokat találjatok minden felmerülő kihívásra.

**3. Tervezz a felszabaduló idővel**

Ha a hírek és a közösségi média hajlamosak sok idődet felemészteni, a Szent Mihály-böjt tökéletes alkalom arra, hogy tudatosan visszaszerezd ezt az időt.
A legegyszerűbb – és gyakran a legjelentősebb – helyettesítés az, ha jobban jelen vagy a családod számára. 
De ez az időszak arra is lehetőséget adhat, hogy új szokásokat építs, amelyek tartós növekedéshez vezetnek.

Vegyél kézbe egy jó lelki vagy klasszikus könyvet, végezz el néhány régóta halogatott ház körüli feladatot, vagy kezdj el fejleszteni egy készséget, amelyet eddig halogattál.
Bármit is választasz, engedd, hogy nagyobb szabadság felé vezessen – olyan élet felé, amely inkább Istenre és másokra összpontosít, és szabadabb a képernyődtől.

# Copy to the project root as config.toml (gitignored) or to
# ~/.config/exodus90-printer/config.toml and adjust.
# output_dir and formats are REQUIRED (no built-in default).
# Every value can also be set via EXODUS90_* env vars.

base_url = "https://app.exodus90.com"

# Optional: the numeric id of your challenge (https://app.exodus90.com/programs/<id>).
# Omitted = auto-discovered from the app's today page.
# program_id = 208

output_dir = "~/Desktop/exodus90-readings"

# Any subset of: "markdown", "pdf", "print"
formats = ["pdf", "print"]

# CUPS printer name; omit to use the system default printer.
# `exodus90 printers` lists network printers discovered via mDNS.
printer = "HL-B2080DW_series"

pdf_font_dir = "/usr/share/fonts/liberation-serif-fonts"
pdf_font_family = "LiberationSerif"
